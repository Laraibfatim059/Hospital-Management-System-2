<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Hospital Management System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #080A0F;
        color: #F8FAFC;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
      }
      .ambient-glow-1 {
        position: absolute;
        top: -100px;
        left: -100px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, transparent 70%);
        pointer-events: none;
      }
      .ambient-glow-2 {
        position: absolute;
        bottom: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 92, 252, 0.15) 0%, transparent 70%);
        pointer-events: none;
      }
      .card {
        position: relative;
        z-index: 10;
        max-width: 480px;
        width: 100%;
        background: #151A24;
        border: 1px solid #1E293B;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }
      .graphic-container {
        position: relative;
        display: inline-block;
        margin-bottom: 1.5rem;
      }
      .num-404 {
        font-size: 6.5rem;
        font-weight: 900;
        color: #1C2333;
        line-height: 1;
        letter-spacing: 0.1em;
        user-select: none;
      }
      .badge-3d {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #00D4FF 0%, #7C5CFC 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(0, 212, 255, 0.4);
        animation: float3d 5s ease-in-out infinite;
      }
      @keyframes float3d {
        0%, 100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-6px);
        }
      }
      .badge-pill {
        display: inline-block;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(0, 212, 255, 0.1);
        color: #00D4FF;
        border: 1px solid rgba(0, 212, 255, 0.25);
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #FFFFFF;
      }
      p {
        font-size: 0.9rem;
        color: #94A3B8;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.8rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 0.75rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
      }
      .btn-primary {
        background: linear-gradient(135deg, #00D4FF 0%, #00B4D8 100%);
        color: #080A0F;
        border: none;
        box-shadow: 0 4px 14px rgba(0, 212, 255, 0.25);
      }
      .btn-primary:hover {
        opacity: 0.95;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 212, 255, 0.35);
      }
      .btn-secondary {
        background: #1C2333;
        color: #CBD5E1;
        border: 1px solid #334155;
        margin-top: 0.75rem;
      }
      .btn-secondary:hover {
        background: #252D40;
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="card">
      <div class="graphic-container">
        <div class="num-404">404</div>
        <div class="badge-3d">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#080A0F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            <path d="M12 5v14" />
          </svg>
        </div>
      </div>

      <div class="badge-pill">404 • Resource Not Found</div>
      <h1>Page Not Found</h1>
      <p>The page, medical record, or route you requested cannot be located. Please check the address or return to the hospital dashboard.</p>

      <a href="/" class="btn btn-primary">Return to Hospital System</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go to Previous Page</a>
    </div>
  </body>
</html>
